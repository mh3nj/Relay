name: Bug report
description: Report a reproducible problem in Relay.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Please do not include API keys, personal backups, private data, or sensitive logs. For security issues, use SECURITY.md instead."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open… 2. Choose… 3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/version, operating system, installed PWA or browser tab, and online/offline state.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots are welcome if they contain no private information.
